# Yemek Gelsin — tek VPS dağıtımı (00 §12a, 14 §1): postgres, migrate, api, worker, web, caddy.
# Kurulum ve işletim: docs/15-kurulum-ve-isletim.md. Canlı ortam (Türkiye VPS; 00 §12a madde 10) GitHub Actions ile
# kurulur ve güncellenir (.github/workflows/deploy-production.yml, 15 §14): .env'i scripts/vps/env-merge.mjs yazar,
# scripts/vps/deploy.sh bu dosyayı çalıştırır. Seed canlı ortamda çalışmaz. Elle kurulum:
#   cp docker/env.production.example .env   # değerleri doldurun
#   docker compose build
#   docker compose up -d                     # migrate işi api/worker'dan önce bir kez çalışır
#   docker compose run --rm migrate          # (güncellemeden sonra elle de çalıştırılabilir)
#   docker compose run --rm api node --import tsx /app/scripts/create-admin.ts --email ... --name ...
# Yalnız 80/443 dışarı açıktır; PostgreSQL, API ve web iç ağdadır.

name: siparisinonunde

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# API ve worker aynı imajı kullanır (docker/api.Dockerfile)
x-api-base: &api-base
  image: siparisinonunde-api:latest
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  # WhatsApp: PLATFORM_WA_PROVIDER/API_KEY/PHONE_NUMBER_ID(/WABA_ID) ve ortak numara (00 §12a madde 8) PLATFORM_WA_DISPLAY_PHONE,
  # PLATFORM_WA_WEBHOOK_TOKEN .env'den okunur (docker/env.production.example); mock dışı sağlayıcıda boşsa api açılmaz.
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER:-siparis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde zorunlu}@postgres:5432/${POSTGRES_DB:-siparis}
    APP_BASE_URL: https://${DOMAIN:?DOMAIN .env içinde zorunlu}
    API_PORT: "4000"
    API_HOST: 0.0.0.0
    UPLOAD_DIR: /data/uploads
    # Üretimde geliştirici araçları kapalı (/dev/whatsapp, /api/v1/dev/*)
    DEV_TOOLS: ${DEV_TOOLS:-0}
    # Platform yöneticilerine iki adımlı doğrulama zorunlu (00 §12a madde 7); .env ile kapatılamaz
    ADMIN_TOTP_REQUIRED: "true"
    # env_file tüm .env'i yükler; uygulamanın okumadığı gizli değerler api/worker/migrate süreçlerine VERİLMEZ (boşla ezilir):
    # Cloudflare token'ı (DNS düzenleme yetkili) yalnız caddy'ye, yedek izleme adresi yalnız sunucudaki backup.sh'e aittir.
    # Uygulama ortamı sızsa (RCE, hata dökümü, bağımlılık) alan adı ele geçirilemesin (15 §14).
    CLOUDFLARE_API_TOKEN: ""
    BACKUP_PING_URL: ""
    BACKUP_REMOTE: ""
  volumes:
    - uploads:/data/uploads
  logging: *logging
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siparis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde zorunlu}
      POSTGRES_DB: ${POSTGRES_DB:-siparis}
      TZ: UTC
    # 2 vCPU / 4 GB başlangıç sunucusu için ölçülü ayarlar
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
    # ./backups bağlanmaz: backup.sh/restore.sh dökümü `docker compose exec` ile akıtır. Bağlansaydı Docker klasörü
    # root sahipliğinde oluşturur ve siparis kullanıcısının cron yedeği yazamazdı (docs/15 §8).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    logging: *logging
    restart: unless-stopped

  # Şema migration'ları (packages/db/migrations/*.sql, ad sırasıyla; uygulananlar _migrations'ta)
  migrate:
    <<: *api-base
    command: ["node", "--import", "tsx", "/app/packages/db/src/migrate.ts"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-base
    command: ["node", "--import", "tsx", "src/server.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *api-base
    command: ["node", "--import", "tsx", "src/worker.ts"]
    # SIGTERM'de sürmekte olan iş bitirilir, başlanmamışlar sıraya döner (apps/api/src/worker.ts). Dış çağrı zaman
    # aşımı 15 sn; bir iş birden fazla çağrı yapabildiği için süre bol tutulur (SIGKILL yarım gönderim bırakmasın)
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Vadesi 5 dk'dan fazla geçmiş bekleyen iş varsa worker sağlıksızdır (scripts/worker-health.ts)
      test: ["CMD", "node", "--import", "tsx", "/app/scripts/worker-health.ts"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  web:
    image: siparisinonunde-web:latest
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      # NEXT_PUBLIC_* ve API_INTERNAL_URL derleme anında gömülür (değişince: docker compose build web)
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?DOMAIN .env içinde zorunlu}
        NEXT_PUBLIC_ROOT_DOMAIN: ${DOMAIN}
        NEXT_PUBLIC_DEV_TOOLS: ${DEV_TOOLS:-0}
        # Canlı ortamda demo işletme yok: boş (pazarlama sitesindeki "Demo menüyü aç" kartı gizlenir; 00 §12a madde 10)
        NEXT_PUBLIC_DEMO_STORE_SLUG: ${DEMO_STORE_SLUG:-}
        # "Demo ortamı" uyarısı: yalnız demo verili ortamlarda 1 (varsayılan kapalı)
        NEXT_PUBLIC_DEMO_BANNER: ${DEMO_BANNER:-0}
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
        API_INTERNAL_URL: http://api:4000
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      APP_BASE_URL: https://${DOMAIN}
      DEV_TOOLS: ${DEV_TOOLS:-0}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/panel/giris"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  caddy:
    image: siparisinonunde-caddy:latest
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL .env içinde zorunlu}
      # Tüm sertifikalar DNS-01 ile (Caddyfile acme_dns): yalnız bu bölgede Zone > DNS > Edit + Zone > Zone > Read.
      # Bu token'ı yalnız caddy alır (api/worker/migrate'e boş verilir: x-api-base)
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN .env içinde zorunlu (Caddy DNS-01; 15 §3)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Erişim logları (5651: 1 yıl saklama; Caddyfile (access_log))
      - caddy_logs:/var/log/caddy
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  caddy_logs:
