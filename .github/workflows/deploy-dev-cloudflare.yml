# CANLI ORTAM, Cloudflare (docs/15 §13; 00 §12a madde 10): Worker + tek container (PostgreSQL + API + worker + web) + R2
# yedek. yemekgelsin.net gerçek verilerle burada çalışır; kişisel veri yurt dışında (KVKK m.9 standart sözleşme). İki kip:
#   - VPS_HOST secret'ı YOKSA (olağan durum) → ALAN ADI kipi = canlı ortam: https://yemekgelsin.net (Custom Domain), push'ta
#     ve elle çalışır. Üretim kipi (DEPLOY_ENV=production): platform yöneticisi için iki adımlı doğrulama zorunlu (ilk
#     girişte kurulur), geliştirici araçları ve WhatsApp simülatörü kapalı (/dev/* ve /api/v1/dev/* 404), arama motorlarına
#     açık. Demo verisi YOK: seed yalnız platform yöneticisini (admin@yemekgelsin.net, parola DEV_PASSWORD) ve üretim
#     bayraklarını kurar; yeni işletme kaydı ve /demo lead formu AÇIK; "Demo ortamı" uyarısı yok. D360_API_KEY + WA_PHONE
#     (360dialog), TWILIO_* + WA_PHONE (Twilio) ya da META_* + WA_PHONE (Meta doğrudan) tamsa ortak numara gerçek
#     WhatsApp'la çalışır; değilse çalışan
#     WhatsApp yoktur (vitrinde ve QR'da bağlantı gösterilmez).
#     Yedek: 2 dakikada bir (değişiklik varsa) ve her kapanışta R2'ye; beklenmedik çökme en çok ~2 dakikayı kaybettirir.
#   - VPS_HOST secret'ı VARSA (isteğe bağlı Türkiye VPS'i canlıda; PLANLANMIYOR, 00 §12a madde 10) → GİZLİ STAGING: yalnız
#     elle çalıştırılır (push'ta atlanır), yalnız workers.dev adresine dağıtır, Custom Domain eklemez (alan adı o zaman
#     "Canlı ortam (Türkiye VPS)" iş akışına aittir), tüm site DEV_PASSWORD ile parolalı, demo verili (SEED_MODE=demo),
#     WhatsApp her zaman simülatör, kendi veri dönemi (wrangler.jsonc STAGING_DATA_EPOCH). DİKKAT: VPS_HOST eklemek alan
#     adını boş veritabanlı VPS'e taşır; buradaki canlı veri kendiliğinden taşınmaz (docs/15 §14).
# Gereken GitHub secret'ları (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  — "Edit Cloudflare Workers" şablonuyla oluşturulan token (Containers için Workers Paid plan).
#                           Özel alan adı için ayrıca yemekgelsin.net bölgesinde: Zone > Workers Routes > Edit ve
#                           Zone > Zone > Read (Zone Resources: Include > Specific zone > yemekgelsin.net).
#   DEV_PASSWORD          — platform yöneticisinin (admin@yemekgelsin.net) parolası; her açılışta buna eşitlenir (en az 8,
#                           önerilen en az 12 karakter). Staging'de ayrıca tüm sitenin ve demo hesaplarının parolası
#   CLOUDFLARE_ACCOUNT_ID — isteğe bağlı; token birden fazla hesaba erişiyorsa zorunlu
#   SUPPORT_WHATSAPP      — isteğe bağlı; destek hattı (ülke koduyla, ör. 905321234567): "Parolamı unuttum" ve kayıt
#                           kapalıyken "Bize ulaşın" bağlantıları bu numaraya WhatsApp'tan yazdırır
# Gerçek WhatsApp (isteğe bağlı, yalnız alan adı kipi). İki yoldan biri; ikisi birlikte verilirse dağıtım durur:
#   360dialog (VARSAYILAN, docs/15 §6.2): D360_API_KEY (360dialog'un numaraya verdiği API anahtarı), WA_PHONE (E.164)
#   Twilio (docs/15 §6.2d, docs/16): TWILIO_ACCOUNT_SID (AC…), TWILIO_AUTH_TOKEN, WA_PHONE (E.164)
#   Meta doğrudan (alternatif, docs/15 §6.2b): META_WA_TOKEN, META_WA_PHONE_NUMBER_ID, META_WA_WABA_ID (isteğe bağlı),
#                                             META_APP_SECRET, WA_PHONE (E.164)
# Seçilen yolun secret'larından biri eksikse mock (canlı ortamda çalışan WhatsApp yok).
# Secret eklemek/değiştirmek dağıtımı kendiliğinden başlatmaz: Actions > "Canlı ortam (Cloudflare)" > Run workflow.
# Dosya adı (deploy-dev-cloudflare.yml) ve Worker adı (siparisinonunde-dev) iç tanımlayıcıdır, değişmez (00 §12a madde 9).
# DAĞITIM KAPISI (denetim 2026-10-04 · B4, B5 · FAZ 0.5 + 0.6 + 0.7) — kapının tamamı ve DAL POLİTİKASI önerisi
# .github/workflows/testler.yml dosyasının başında anlatılıyor; tek kaynak orası. Burada olan bitenin özeti:
#   - `testler` işi o kapıyı çağırır (PostgreSQL 16 + tür denetimi + ~897 test); `deploy` `needs: [kontrol, testler]`
#     ile bekler, kapı kırmızıysa wrangler HİÇ çalışmaz.
#   - Duman testi (ya da deploy'un kendisi) kırmızıysa son adım `wrangler rollback` ile Worker'ı geri alır. YARIM bir
#     geri alıştır: container imajı ve veritabanı geri ALINMAZ (ayrıntı o adımın yorumunda ve iş akışı özetinde).
#   - `workflow_dispatch` > `ref`: eski bir commit SHA'sı verilirse o sürüm dağıtılır; APP_VERSION ve duman testi
#     tetikleyen commit'i değil GERÇEKTEN dağıtılan commit'i (DEPLOY_SHA) kullanır. Tam geri alış yolu budur.
#   - Tetikleyici (ajan dalı dahil) BİLEREK değiştirilmedi; karar Eray'ın (testler.yml > DAL POLİTİKASI).
name: Canlı ortam (Cloudflare)

on:
  push:
    branches: [main, claude/relaxed-pascal-1m775m]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      ref:
        description: "Dağıtılacak commit, etiket ya da dal (boş: seçilen dalın son hâli). Geri almak için eski commit SHA'sını yazın."
        type: string
        required: false
        default: ''

# Grup adı deploy-production.yml ile AYNI: iki iş akışı aynı alan adına dağıtır, üst üste gelmesinler.
concurrency:
  group: yemekgelsin-canli-dagitim
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Alan adı kipinde sitenin kanonik adresi: web derlemesine (NEXT_PUBLIC_SITE_URL) ve API'ye (APP_BASE_URL) yazılır.
  # wrangler.jsonc'deki routes (Custom Domain) bu adresin alan adıyla aynı olmalı. Staging'de workers.dev adresiyle değişir.
  SITE_URL: https://yemekgelsin.net
  # Alan adının Cloudflare bölgesi (Registrar'dan alınan kök alan adı).
  ZONE: yemekgelsin.net

jobs:
  # Kip seçimi ve secret denetimi. VPS varsa push'ta atlanır (bilgi); secret eksikse push'ta uyarı, elle çalıştırmada hata.
  kontrol:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            mode=staging
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::VPS_HOST secret'ı var: isteğe bağlı Türkiye VPS yolu seçilmiş, yemekgelsin.net 'Canlı ortam (Türkiye VPS)' iş akışına aittir. Cloudflare ortamı artık gizli staging'dir ve yalnız elle çalıştırılır: Actions > Canlı ortam (Cloudflare) > Run workflow (docs/15 §13, §14). Cloudflare'de canlı kalmak için VPS_HOST secret'ını silin."
              exit 0
            fi
          else
            mode=domain
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$DEV_PASSWORD" ] || missing+=(DEV_PASSWORD)
          if [ ${#missing[@]} -eq 0 ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; echo "Kip: $mode"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          msg="Eksik GitHub secret: ${missing[*]} — Settings > Secrets and variables > Actions (docs/15 §13)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
          echo "::warning::Canlı ortam dağıtımı atlandı. $msg"

  # DAĞITIM KAPISI: monorepo'nun tür denetimi ve testleri (PostgreSQL 16 servisiyle). Kırmızıysa `deploy` hiç başlamaz.
  # `kontrol` hazır değilse (secret eksik ya da VPS yolu seçilmiş) kapı da koşmaz: boşa 40 dk CI harcanmasın.
  testler:
    needs: kontrol
    if: needs.kontrol.outputs.ready == 'true'
    uses: ./.github/workflows/testler.yml
    with:
      # Elle eski bir sürüme dönülüyorsa kapı da O sürümün testlerini koşar (dalın son hâlini değil).
      ref: ${{ inputs.ref || github.sha }}

  deploy:
    needs: [kontrol, testler]
    if: needs.kontrol.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Dağıtım ortamı. GitHub > Settings > Environments > production > "Required reviewers" açıldığı anda her dağıtım
    # onay bekler (bkz. dosya başındaki DAL POLİTİKASI önerisi). Ortam yoksa ilk çalıştırmada kuralsız oluşturulur ve
    # dağıtım bugünkü gibi akar — bu satır tek başına hiçbir şeyi kilitlemez.
    environment: production
    env:
      MODE: ${{ needs.kontrol.outputs.mode }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          # `ref` girdisi verilmişse o sürüm dağıtılır (elle geri alma); push'ta tetikleyen commit.
          ref: ${{ inputs.ref || github.sha }}

      # GERÇEKTEN dağıtılan commit. `github.sha` iş akışını tetikleyen commit'tir; `ref` ile eski bir sürüme
      # dönüldüğünde ikisi FARKLIDIR. APP_VERSION ve duman testinin sürüm karşılaştırması bunu kullanır, yoksa
      # geri alma dağıtımında duman testi hiç eşleşmeyen bir sürümü 20 dk bekler.
      - name: Dağıtılacak sürüm (commit)
        run: |
          sha="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$sha" >> "$GITHUB_ENV"
          echo "Dağıtılacak sürüm: ${sha:0:12}"
          # `inputs.ref` değeri KABUĞA GÖMÜLMEZ (betik enjeksiyonu): yalnız tetikleyen commit'ten farklı mı denir.
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::notice::Elle seçilen bir sürüm dağıtılıyor (${sha:0:12}); dalın son hâli değil. Geri alma dağıtımı ise duman testi de bu sürümü arar."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json

      # YALNIZ Worker kabuğu (deploy/cloudflare: access, mode, whatsapp-env, config-modes — 31 node:test vakası) ve
      # wrangler'ın kendisi. Monorepo'nun tür denetimi ve ~897 testi `testler` işinde koştu; bu iş onu BEKLEDİ.
      - name: Worker kabuğu bağımlılıkları, tür denetimi ve testleri
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Cloudflare hesabı ve alan adı erişimi
        id: cf
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ids=$(api "/accounts?per_page=50" | jq -r '.result[]?.id')
            count=$(printf '%s\n' "$ids" | grep -c . || true)
            if [ "$count" != "1" ]; then
              echo "::error::Token $count hesaba erişiyor; CLOUDFLARE_ACCOUNT_ID secret'ını ekleyin"
              exit 1
            fi
            CLOUDFLARE_ACCOUNT_ID="$ids"
            echo "CLOUDFLARE_ACCOUNT_ID=$ids" >> "$GITHUB_ENV"
          fi

          # workers.dev adresi: canlı ortamda (alan adı kipi) yalnız yedek adresin duman testi için, staging'de sitenin kendisi
          sub=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          workers_dev=""
          [ -n "$sub" ] && workers_dev="https://siparisinonunde-dev.${sub}.workers.dev"
          echo "workers_dev=$workers_dev" >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "staging" ]; then
            if [ -z "$workers_dev" ]; then
              echo "::error::workers.dev alt alan adı bulunamadı; staging yalnız workers.dev'de çalışır. Cloudflare > Workers & Pages > Overview'da workers.dev alt alan adını etkinleştirin (docs/15 §13)."
              exit 1
            fi
            echo "SITE_URL=$workers_dev" >> "$GITHUB_ENV"
            # Alan adı hâlâ bu Worker'a bağlıysa (canlı ortam DNS geçişi yapılmadı) staging onu ele geçirmesin
            if ! st=$(node ../../scripts/vps/cloudflare-dns.mjs status --zone "$ZONE"); then
              printf '%s\n' "$st"
              echo "::error::yemekgelsin.net'in Worker'a bağlı olup olmadığı doğrulanamadı (yukarıdaki hata). Staging, canlı ortam DNS geçişinden sonra çalışır (docs/15 §13)."
              exit 1
            fi
            if [ "$(printf '%s' "$st" | jq -r '.workerDomains == null')" = "true" ]; then
              echo "::error::Token Worker Custom Domain'lerini listeleyemiyor (Account > Workers Scripts); yemekgelsin.net'in bu Worker'dan ayrıldığı doğrulanamadı (docs/15 §13)."
              exit 1
            fi
            attached=$(printf '%s' "$st" | jq -r --arg z "$ZONE" '[.workerDomains[] | select(.service == "siparisinonunde-dev" and (.hostname == $z or .hostname == ("www." + $z))) | .hostname] | join(", ")')
            if [ -n "$attached" ]; then
              echo "::error::$attached hâlâ bu Worker'a bağlı: isteğe bağlı Türkiye VPS'inin DNS geçişi tamamlanmadı. Önce 'Canlı ortam (Türkiye VPS)' iş akışı başarıyla bitmeli; staging ondan sonra çalıştırılır. Cloudflare'de canlı kalmak istiyorsanız VPS_HOST secret'ını silin (docs/15 §13, §14)."
              exit 1
            fi
            echo "Gizli staging: $workers_dev (özel alan adı yok; yemekgelsin.net canlı ortamda)"
            exit 0
          fi

          host="${SITE_URL#https://}"; host="${host%%/*}"
          zone="$ZONE"
          if [ "$host" != "$zone" ] && [ "${host%."$zone"}" = "$host" ]; then
            echo "::error::SITE_URL ($SITE_URL) ZONE ($zone) bölgesinde değil. İş akışındaki SITE_URL ve ZONE değerlerini birlikte güncelleyin (docs/15 §3, §13)."
            exit 1
          fi
          perm_msg="Cloudflare > My Profile > API Tokens > token'ı düzenleyin ve $zone bölgesi için şu izinleri ekleyin: Zone > Workers Routes > Edit ve Zone > Zone > Read (Zone Resources: Include > Specific zone > $zone). Sonra iş akışını yeniden çalıştırın (docs/15 §13)."
          zres=$(api "/zones?name=$zone&account.id=$CLOUDFLARE_ACCOUNT_ID")
          zone_id=$(printf '%s' "$zres" | jq -r '.result[0]?.id // empty')
          if [ -z "$zone_id" ]; then
            echo "::error::Özel alan adı kurulamadı: token $zone bölgesini göremiyor (Zone > Zone > Read izni eksik ya da bölge bu hesapta değil). $perm_msg"
            exit 1
          fi
          zstatus=$(printf '%s' "$zres" | jq -r '.result[0].status')
          [ "$zstatus" = "active" ] || echo "::warning::$zone bölgesinin durumu \"$zstatus\" (active değil); sertifika ve DNS gecikebilir."
          rcode=$(curl -sS -o "$RUNNER_TEMP/routes.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" || echo 000)
          if [ "$rcode" != "200" ] || [ "$(jq -r '.success' "$RUNNER_TEMP/routes.json" 2>/dev/null)" != "true" ]; then
            echo "::error::Özel alan adı kurulamadı: token'da $zone için Zone > Workers Routes > Edit izni yok (HTTP $rcode). $perm_msg"
            exit 1
          fi
          echo "$zone erişimi tamam (bölge $zone_id, $zstatus)"
          [ -n "$workers_dev" ] || echo "::warning::workers.dev alt alan adı bulunamadı; yedek adres denetimi atlanacak"

      # Ortak numara kipi (Worker aynı kuralı uygular: src/whatsapp-env.ts): alan adı kipinde D360_API_KEY + WA_PHONE →
      # 360dialog (d360); TWILIO_ACCOUNT_SID + TWILIO_AUTH_TOKEN + WA_PHONE → Twilio (twilio); META_WA_TOKEN +
      # META_WA_PHONE_NUMBER_ID + META_APP_SECRET + WA_PHONE → Meta Cloud API (cloud); birden çoğu birlikte → belirsiz,
      # dağıtım durur; hiçbiri tam değilse mock (canlı ortamda çalışan WhatsApp yok). Staging her zaman simülatördür.
      # Değerler loga yazılmaz.
      - name: WhatsApp kipi (gerçek numara ya da mock)
        id: wa
        env:
          D360_API_KEY: ${{ secrets.D360_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          META_WA_TOKEN: ${{ secrets.META_WA_TOKEN }}
          META_WA_PHONE_NUMBER_ID: ${{ secrets.META_WA_PHONE_NUMBER_ID }}
          META_WA_WABA_ID: ${{ secrets.META_WA_WABA_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
        run: |
          if [ "$MODE" = "staging" ]; then
            echo "mode=mock" >> "$GITHUB_OUTPUT"
            echo "WhatsApp: simülatör (gizli staging canlı numarayı kullanmaz)"
            exit 0
          fi
          filled() { [ -n "$(printf '%s' "${!1}" | tr -d '[:space:]')" ]; }
          # Yolların ANAHTAR takımı tam mı (ortak olan WA_PHONE sayılmaz; src/whatsapp-env.ts ile aynı kural)
          paths=()
          filled D360_API_KEY && paths+=("360dialog")
          { filled TWILIO_ACCOUNT_SID && filled TWILIO_AUTH_TOKEN; } && paths+=("Twilio")
          { filled META_WA_TOKEN && filled META_WA_PHONE_NUMBER_ID && filled META_APP_SECRET; } && paths+=("Meta")
          if [ ${#paths[@]} -gt 1 ]; then
            echo "::error::Birden çok WhatsApp yolunun secret'ları tanımlı (${paths[*]}): ortak numaranın hangi yoldan bağlanacağı belirsiz. Kullanmadığınız yolların secret'larını silin — 360dialog: D360_API_KEY; Twilio: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN; Meta doğrudan: META_WA_TOKEN, META_WA_PHONE_NUMBER_ID, META_WA_WABA_ID, META_APP_SECRET (docs/15 §6.2, §6.2b, §6.2d)."
            exit 1
          fi
          if [ ${#paths[@]} -eq 0 ]; then
            echo "mode=mock" >> "$GITHUB_OUTPUT"
            if filled WA_PHONE; then
              echo "::warning::WA_PHONE var ama anahtar yok: 360dialog için D360_API_KEY (docs/15 §6.2) ya da Twilio için TWILIO_ACCOUNT_SID + TWILIO_AUTH_TOKEN (docs/15 §6.2d) secret'larını ekleyin. O zamana kadar canlı ortamda çalışan WhatsApp yoktur (mock)."
            elif filled META_WA_TOKEN || filled META_WA_PHONE_NUMBER_ID || filled META_APP_SECRET || filled TWILIO_ACCOUNT_SID || filled TWILIO_AUTH_TOKEN; then
              echo "::warning::WhatsApp secret'ları yarım: hiçbir yol tamamlanmadı, canlı ortamda çalışan WhatsApp yok (mock). 360dialog: D360_API_KEY + WA_PHONE (docs/15 §6.2); Twilio: TWILIO_ACCOUNT_SID + TWILIO_AUTH_TOKEN + WA_PHONE (docs/15 §6.2d); Meta doğrudan: META_WA_TOKEN + META_WA_PHONE_NUMBER_ID + META_APP_SECRET + WA_PHONE (docs/15 §6.2b)."
            else
              echo "WhatsApp: mock (D360_API_KEY / TWILIO_* / META_* secret'ları yok; canlı ortamda çalışan WhatsApp yok). Bağlamak: docs/15 §6.2"
            fi
            exit 0
          fi
          if ! filled WA_PHONE; then
            echo "mode=mock" >> "$GITHUB_OUTPUT"
            echo "::warning::${paths[0]} için WA_PHONE GitHub secret'ı eksik (ortak numara, ülke koduyla: +905321234567). Eklenene kadar canlı ortamda çalışan WhatsApp yoktur (mock)."
            exit 0
          fi
          case "${paths[0]}" in
            360dialog)
              echo "mode=d360" >> "$GITHUB_OUTPUT"
              echo "WhatsApp: gerçek numara, 360dialog (simülatör kapalı)"
              ;;
            Twilio)
              echo "mode=twilio" >> "$GITHUB_OUTPUT"
              echo "WhatsApp: gerçek numara, Twilio (simülatör kapalı)"
              case "$TWILIO_ACCOUNT_SID" in
                AC*) ;;
                *) echo "::error::TWILIO_ACCOUNT_SID \"AC\" ile başlamalı (console.twilio.com > Account Info); telefon numarası ya da API Key SID değildir (docs/15 §6.2d)."; exit 1 ;;
              esac
              ;;
            Meta)
              echo "mode=cloud" >> "$GITHUB_OUTPUT"
              echo "WhatsApp: gerçek numara, Meta Cloud API doğrudan (simülatör kapalı)"
              filled META_WA_WABA_ID || echo "::warning::META_WA_WABA_ID secret'ı yok: admin > WhatsApp > WhatsApp kurulumu'ndaki \"Webhook aboneliğini aç\" ve \"Şablonları gönder\" adımları çalışmaz (docs/15 §6.2b)."
              ;;
          esac
          # Kullanılmayan yolların artık secret'ları: yok sayılır, ama karışıklık yaratmasın diye uyarılır
          leftover=()
          if [ "${paths[0]}" != "360dialog" ]; then
            filled D360_API_KEY && leftover+=("D360_API_KEY")
          fi
          if [ "${paths[0]}" != "Twilio" ]; then
            for n in TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN; do filled "$n" && leftover+=("$n"); done
          fi
          if [ "${paths[0]}" != "Meta" ]; then
            for n in META_WA_TOKEN META_WA_PHONE_NUMBER_ID META_WA_WABA_ID META_APP_SECRET; do filled "$n" && leftover+=("$n"); done
          fi
          [ ${#leftover[@]} -eq 0 ] || echo "::warning::${paths[0]} kullanılıyor; diğer yolların secret'ları yok sayıldı: ${leftover[*]}. Karışıklık olmaması için GitHub'dan silin."

      - name: Yapılandırma ve gizli değerler
        env:
          SUPPORT_WHATSAPP: ${{ secrets.SUPPORT_WHATSAPP }}
          D360_API_KEY: ${{ secrets.D360_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          META_WA_TOKEN: ${{ secrets.META_WA_TOKEN }}
          META_WA_PHONE_NUMBER_ID: ${{ secrets.META_WA_PHONE_NUMBER_ID }}
          META_WA_WABA_ID: ${{ secrets.META_WA_WABA_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
        run: |
          APP_VERSION="$DEPLOY_SHA" node scripts/prepare-config.mjs "$SITE_URL" --mode "$MODE"
          # İlk dağıtımda Worker yoktur: liste boş sayılır, tüm gizli değerler üretilir
          npx wrangler secret list -c wrangler.generated.jsonc --format json > "$RUNNER_TEMP/existing.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/existing.json"
          # Gerçek WhatsApp secret'ları yalnız alan adı kipinde ve doluysa yüklenir (secrets.mjs; geçersiz telefon/kimlik,
          # boşluklu anahtar ya da iki yolun birlikte verilmesi burada durdurur). Staging'de hiç yüklenmez.
          wa_flag=()
          [ "$MODE" = "staging" ] && wa_flag=(--no-whatsapp)
          node scripts/secrets.mjs "$RUNNER_TEMP/existing.json" "${wa_flag[@]}" > "$RUNNER_TEMP/secrets.json"
          # GitHub'da boşaltılan (staging'de: tüm) WhatsApp secret'ları Worker'dan da silinir: --secrets-file eksik secret'ı
          # silmez; silinmezse container eski değerle gerçek kipte kalır
          for name in D360_API_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN META_WA_TOKEN META_WA_PHONE_NUMBER_ID META_WA_WABA_ID META_APP_SECRET WA_PHONE; do
            empty=0
            [ "$MODE" = "staging" ] && empty=1
            [ -z "$(printf '%s' "${!name}" | tr -d '[:space:]')" ] && empty=1
            if [ "$empty" = "1" ] && jq -e --arg n "$name" 'any(.[]?; .name == $n)' "$RUNNER_TEMP/existing.json" > /dev/null 2>&1; then
              echo "Worker'daki $name siliniyor"
              npx wrangler secret delete "$name" -c wrangler.generated.jsonc
            fi
          done

      - name: Dağıt (Worker + container imajı; canlı ortamda özel alan adı)
        id: dagit
        run: |
          # Geri alma kapısı: bu noktadan SONRA Worker canlıda değişmiş olabilir. wrangler, Worker sürümünü imaj ve
          # rollout adımlarından ÖNCE etkinleştirir ve adımlar transactional DEĞİLDİR: deploy hata verse bile yeni
          # Worker canlı olabilir (developers.cloudflare.com/containers/guides/deploy). Bu yüzden işaret deploy'dan
          # önce yazılır; "if: failure()" adımı buna bakar.
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          set +e
          npx wrangler deploy -c wrangler.generated.jsonc --secrets-file "$RUNNER_TEMP/secrets.json" --containers-rollout=immediate 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          set -e
          rm -f "$RUNNER_TEMP/secrets.json"
          if [ "$status" != "0" ]; then
            # Yalnız wrangler'ın son hata bloğu sınıflandırılır: Docker derleme çıktısı ve tetikleyici listesindeki
            # "(custom domain)" satırları imaj ya da rollout hatalarını izin hatası gibi göstermesin.
            n=$(grep -n '\[ERROR\]' "$RUNNER_TEMP/deploy.log" | tail -1 | cut -d: -f1 || true)
            err=""
            [ -n "$n" ] && err=$(tail -n +"$n" "$RUNNER_TEMP/deploy.log")
            if printf '%s' "$err" | grep -qiE '/workers/domains|/workers/routes|custom domain'; then
              if printf '%s' "$err" | grep -qiE 'dns record|cname|already exists|externally managed|conflict'; then
                echo "::error::Özel alan adı eklenemedi: $ZONE ya da www.$ZONE için DNS'te çakışan bir kayıt var. Cloudflare > $ZONE > DNS > Records'ta bu adların A/AAAA/CNAME kayıtlarını silip iş akışını yeniden çalıştırın (docs/15 §13). İsteğe bağlı Türkiye VPS'i canlıdaysa VPS_HOST secret'ı eklenmiş olmalı: bu iş akışı o zaman alan adına dokunmaz."
              elif printf '%s' "$err" | grep -qiE 'authentication error|code: 10000|not authorized|unauthorized|forbidden|permission'; then
                echo "::error::Özel alan adı eklenemedi (token izni). Cloudflare > My Profile > API Tokens > token'ı düzenleyin ve $ZONE bölgesi için şu izinleri ekleyin: Zone > Workers Routes > Edit ve Zone > Zone > Read (Zone Resources: Include > Specific zone > $ZONE). Sonra iş akışını yeniden çalıştırın (docs/15 §13)."
              else
                echo "::error::Özel alan adı eklenemedi (çıkış kodu $status); ayrıntı yukarıdaki günlükte (docs/15 §13 Sorun giderme)."
              fi
            else
              echo "::error::wrangler deploy başarısız (çıkış kodu $status); ayrıntı yukarıdaki günlükte."
            fi
            exit "$status"
          fi

      - name: Duman testi
        id: duman
        env:
          WORKERS_DEV: ${{ steps.cf.outputs.workers_dev }}
          WA_MODE: ${{ steps.wa.outputs.mode }}
        run: |
          code_of() { curl -s -o /dev/null -w '%{http_code}' --max-time "${2:-60}" "${@:3}" "$1" || true; }
          fail() { echo "::error::$1"; exit 1; }
          # Staging'de tüm site parolalıdır (sağlık uçları hariç)
          AUTH=()
          [ "$MODE" = "staging" ] && AUTH=(-u "dev:$DEV_PASSWORD")

          # İlk dağıtımda özel alan adının DNS kaydı ve sertifikası birkaç dakika sürer; container ilk açılışta seed ile
          # kurulur. Süreyle sınırlı (15 dk): container açılamazsa her istek ~150 sn bekleyip 503 döner.
          # Eski container, yenisi devralana kadar yanıt vermeye devam eder: sürüm (APP_VERSION = DEPLOY_SHA, yani
          # gerçekten dağıtılan commit) eşleşene kadar beklenir, yoksa eski sürümü (ör. eski demo verisini) test
          # etmiş oluruz.
          code=000; ver=""; i=0
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            i=$((i + 1))
            left=$((deadline - SECONDS)); [ "$left" -gt 170 ] && left=170; [ "$left" -lt 10 ] && left=10
            body=$(curl -s --max-time "$left" -w '\n%{http_code}' "$SITE_URL/api/v1/health" || true)
            code=$(printf '%s' "$body" | tail -n1)
            ver=$(printf '%s' "$body" | sed '$d' | jq -r '.version // empty' 2>/dev/null || true)
            echo "sağlık denemesi $i: HTTP $code, sürüm ${ver:-?}"
            [ "$code" = "200" ] && [ "$ver" = "$DEPLOY_SHA" ] && break
            [ $((deadline - SECONDS)) -gt 15 ] || break
            sleep 15
          done
          [ "$code" = "200" ] || fail "$SITE_URL/api/v1/health 200 dönmedi (son: $code). Özel alan adı, sertifika ya da container hazır değil (docs/15 §13 Sorun giderme)."
          [ "$ver" = "$DEPLOY_SHA" ] || fail "Yeni sürüm 20 dk içinde devreye girmedi (yanıt veren: ${ver:-bilinmiyor}, beklenen: $DEPLOY_SHA)."

          if [ "$MODE" = "staging" ]; then
            # Gizli: parolasız 401 (sağlık uçları açık), parolayla demo verili site
            for path in / /panel/giris /s/bozok-pide; do
              code=$(code_of "$SITE_URL$path" 60)
              [ "$code" = "401" ] || fail "Staging $path parolasız 401 dönmedi ($code)"
            done
            # 200 = hizmet verilebiliyor; yedek/disk/bellek eşikleri `degraded` alanındadır ve kapıyı kırmaz
            code=$(code_of "$SITE_URL/api/v1/health/worker" 60)
            [ "$code" = "200" ] || fail "Staging /api/v1/health/worker parolasız 200 dönmedi ($code)"
            for path in / /s/bozok-pide /s/camlik-doner /panel/giris /admin/giris /yasal/gizlilik /dev/whatsapp /api/v1/dev/wa/accounts; do
              code=$(code_of "$SITE_URL$path" 60 "${AUTH[@]}")
              echo "$path → HTTP $code (parolayla)"
              [ "$code" = "200" ] || fail "Staging $path parolayla 200 dönmedi ($code)"
            done
            for path in / /s/bozok-pide; do
              curl -s --max-time 60 "${AUTH[@]}" "$SITE_URL$path" | grep -q 'Demo ortam' || fail "Staging $path sayfasında \"Demo ortamı\" uyarısı yok"
            done
            curl -s -D - -o /dev/null --max-time 60 "$SITE_URL/api/v1/health" | grep -qi '^x-robots-tag: noindex' || fail "Staging arama motorlarına kapalı değil (x-robots-tag yok)"
            {
              echo "### Gizli staging hazır (Cloudflare, workers.dev)"
              echo ""
              echo "- Adres: $SITE_URL — tüm site parolalı (kullanıcı adı \`dev\`, parola \`DEV_PASSWORD\`), arama motorlarına kapalı; yalnız sağlık uçları açık."
              echo "- Demo verisi: $SITE_URL/s/bozok-pide (#BOZOK), $SITE_URL/s/camlik-doner (#DONER); panel demo@yemekgelsin.net, admin admin@yemekgelsin.net (parola: DEV_PASSWORD)."
              echo "- WhatsApp simülatörü: $SITE_URL/dev/whatsapp (canlı numara kullanılmaz). Gerçek kullanıcılar: https://$ZONE (Türkiye VPS)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- Canlı ortam (alan adı kipi): herkese açık, gerçek veri, üretim kipi, demo verisi yok ---
          # Duman testi canlı veriye YAZMAZ: lead ucunu yalnız bal küpüyle dener (sessiz 204, kayıt oluşmaz).
          # `/api/v1/health/worker` 200 demek "hizmet verilebiliyor" (veritabanı ayakta, kuyruk takılı değil).
          # Yedek yaşı, disk ve bellek eşikleri bu kodu DEĞİŞTİRMEZ; `degraded` + `warnings` alanlarında raporlanır
          # (aşağıda uyarı olarak basılır). Gerekçe: apps/api/src/routes/health.ts dosya başı — eşik `ok`'i düşürseydi
          # SAĞLAM bir dağıtım yalnızca son yedek biraz eski diye aşağıdaki `wrangler rollback` adımını tetiklerdi.
          for path in / /panel/giris /admin/giris /panel/kayit /demo /yasal/gizlilik /yasal/kvkk-aydinlatma /api/v1/health/worker /robots.txt; do
            code=$(code_of "$SITE_URL$path" 60)
            echo "$path → HTTP $code"
            [ "$code" = "200" ] || fail "$path 200 dönmedi ($code)"
          done
          # Eşik aşımı dağıtımı kırmızı YAPMAZ ama sessiz de kalmaz: iş akışı uyarısı + özet satırı. (Asıl haber yolu
          # uyarı kanalıdır: API `alert()` ile, Worker turu `yedek_eskidi` ile — docs/17 §1.)
          wbody=$(curl -s --max-time 60 "$SITE_URL/api/v1/health/worker" || true)
          if [ "$(printf '%s' "$wbody" | jq -r 'try .degraded catch false' 2>/dev/null)" = "true" ]; then
            uyarilar=$(printf '%s' "$wbody" | jq -r 'try ((.warnings // []) | join(", ")) catch ""' 2>/dev/null || true)
            echo "::warning::Canlı ortam çalışıyor ama eşik aşımı var (degraded): ${uyarilar:-bilinmiyor}. Dağıtım geri ALINMADI; işletim sorunu — docs/17 §2.2 (yedek) / §2.6 (disk, bellek)."
            {
              echo ""
              echo "> ⚠️ Sağlık ucu \`degraded\`: **${uyarilar:-bilinmiyor}**. Dağıtım sağlamdır, bu bir **işletim** uyarısıdır: yedek yaşı docs/17 §2.2, disk/bellek §2.6."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Demo verisi yok: demo vitrinleri 404, "Demo ortamı" uyarısı ve demo vitrin bağlantısı yok
          for path in /s/bozok-pide /s/camlik-doner; do
            code=$(code_of "$SITE_URL$path" 60)
            [ "$code" = "404" ] || fail "$path 404 dönmeli (demo verisi olmamalı; $code)"
          done
          home_headers=$(curl -s -D - -o "$RUNNER_TEMP/home.html" --max-time 60 "$SITE_URL/" || true)
          page=$(cat "$RUNNER_TEMP/home.html" 2>/dev/null || true)
          if grep -q 'Demo ortam' <<< "$page"; then fail "Ana sayfada \"Demo ortamı\" uyarısı var (NEXT_PUBLIC_DEMO_BANNER kapalı olmalı)"; fi
          # Arama motorlarına açık: noindex başlığı ve meta etiketi yok, robots.txt siteyi kapatmıyor
          if grep -qi '^x-robots-tag:' <<< "$home_headers"; then fail "Ana sayfa x-robots-tag başlığı gönderiyor; canlı ortam arama motorlarına açık olmalı (src/mode.ts noindex)"; fi
          if grep -qiE '<meta[^>]+name="robots"[^>]+noindex' <<< "$page"; then fail "Ana sayfada robots noindex meta etiketi var"; fi
          grep -qi '^x-yg-ortam: cloudflare' <<< "$home_headers" || fail "Ana sayfa x-yg-ortam: cloudflare başlığını göndermiyor (Worker yeni sürümde değil mi?)"
          robots=$(curl -s --max-time 60 "$SITE_URL/robots.txt" || true)
          if grep -qiE '^disallow:[[:space:]]*/[[:space:]]*$' <<< "$robots"; then fail "robots.txt tüm siteyi kapatıyor (Disallow: /)"; fi
          echo "Arama motorları: noindex yok, robots.txt açık"
          # /demo: lead formu açık, demo vitrin bağlantısı yok
          page=$(curl -s --max-time 60 "$SITE_URL/demo" || true)
          if grep -q 'Demo menüyü aç' <<< "$page"; then fail "/demo sayfası demo vitrin bağlantısı gösteriyor (demo işletme yok)"; fi
          grep -q 'name="businessName"' <<< "$page" || fail "/demo lead formunu göstermiyor (NEXT_PUBLIC_LEAD_FORM=1 olmalı)"
          # Lead ucu açık: bal küpü dolu istek sessizce 204 alır ve hiçbir şey saklanmaz (kapalıysa 403 leads_closed dönerdi)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST -H 'content-type: application/json' --data '{"name":"Duman Testi","businessName":"Duman","phone":"05000000000","city":"Yozgat","source":"demo_form","website":"duman-testi"}' "$SITE_URL/api/v1/public/leads" || true)
          [ "$code" = "204" ] || fail "POST /api/v1/public/leads (bal küpü) 204 dönmedi ($code): lead ucu kapalı mı (PUBLIC_LEADS_ENABLED)?"
          echo "/demo: lead formu açık (API bal küpüyle 204; kayıt oluşmadı)"
          # Yeni işletme kaydı açık: kayıt formu görünür, "çok yakında" bilgisi yok
          page=$(curl -s --max-time 60 "$SITE_URL/panel/kayit" || true)
          grep -q 'İşletme hesabını aç' <<< "$page" || fail "/panel/kayit kayıt formunu göstermiyor (signup_open kapalı mı? Yönetici /admin/bayraklar'dan kapattıysa bilinçli bir karardır)"
          if grep -q 'Kayıtlar çok yakında açılıyor' <<< "$page"; then fail "/panel/kayit hâlâ \"Kayıtlar çok yakında açılıyor\" diyor (signup_open açık olmalı)"; fi
          code=$(curl -s --max-time 60 "$SITE_URL/api/v1/public/signup-status" || true)
          grep -q '"open":true' <<< "$code" || fail "GET /api/v1/public/signup-status kayıt açık demiyor ($code)"
          echo "/panel/kayit: kayıt formu açık"

          # Geliştirici araçları canlı ortamda yok: Worker 404 döner (parolalı ya da parolasız)
          for path in /dev/whatsapp /api/v1/dev/wa/accounts /api/v1/%64ev/wa/accounts; do
            code=$(code_of "$SITE_URL$path" 60)
            [ "$code" = "404" ] || fail "$path 404 dönmedi ($code): canlı ortamda geliştirici araçları kapalı olmalı"
            code=$(code_of "$SITE_URL$path" 60 -u "dev:$DEV_PASSWORD")
            [ "$code" = "404" ] || fail "$path parolayla 404 dönmedi ($code)"
          done
          echo "Geliştirici araçları: /dev/* ve /api/v1/dev/* 404"

          # Ortak numara webhook'u API'ye ulaşır (Meta çağırır); yanlış belirteç API'den 404 döner
          code=$(code_of "$SITE_URL/api/v1/webhooks/wa/shared/yanlis-belirtec-0000000000" 60)
          [ "$code" = "404" ] || fail "Ortak webhook yolu API'ye ulaşmadı ($code)"

          # www → kök alan adı (301); yalnız site kök alan adındaysa (www rotası wrangler.jsonc'de). www sertifikası
          # kökten biraz sonra hazır olabilir.
          host="${SITE_URL#https://}"; host="${host%%/*}"
          if [ "$host" = "$ZONE" ]; then
            www="https://www.$host"
            res=""
            for i in $(seq 1 20); do
              res=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30 "$www/fiyatlar?kaynak=duman" || true)
              echo "www denemesi $i: $res"
              [ "$res" = "301 $SITE_URL/fiyatlar?kaynak=duman" ] && break
              sleep 15
            done
            [ "$res" = "301 $SITE_URL/fiyatlar?kaynak=duman" ] || fail "www yönlendirmesi 301 → $SITE_URL dönmedi (son: $res)"
          else
            echo "SITE_URL alt alan adında ($host); www denetimi atlandı"
          fi

          # Yedek adres (workers.dev): API çalışır, sayfa gezinmesi özel alan adına yönlenir
          if [ -n "$WORKERS_DEV" ]; then
            code=$(code_of "$WORKERS_DEV/api/v1/health" 60)
            [ "$code" = "200" ] || fail "workers.dev API sağlık denetimi 200 dönmedi ($code)"
            res=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30 -H 'accept: text/html' "$WORKERS_DEV/panel/giris" || true)
            [ "$res" = "302 $SITE_URL/panel/giris" ] || fail "workers.dev sayfa yönlendirmesi beklenen gibi değil ($res)"
            echo "workers.dev: API 200, sayfa → $SITE_URL (302)"
          fi

          {
            echo "### Canlı ortam hazır (Cloudflare)"
            echo ""
            echo "- Adres: $SITE_URL — herkese açık, arama motorlarına açık, gerçek veri (üretim kipi). Demo verisi yok. Kişisel veri Cloudflare'de (yurt dışı): KVKK m.9 standart sözleşmesi ve Kurum bildirimi proje sahibinin yapılacaklarıdır (docs/08 §2.11)."
            echo "- Admin: $SITE_URL/admin/giris — admin@yemekgelsin.net, parola: DEV_PASSWORD. İki adımlı doğrulama zorunlu: ilk girişte /admin/guvenlik'te kurun, kurtarma kodlarını saklayın."
            echo "- Yeni işletme kaydı ($SITE_URL/panel/kayit) ve demo talep formu ($SITE_URL/demo) açık. Yönetici kaydı /admin/bayraklar'dan kapatabilir; dağıtımlar bu karara dokunmaz."
            if [ "$WA_MODE" = "d360" ]; then
              echo "- WhatsApp: gerçek numara (360dialog). Kurulum: $SITE_URL/admin/whatsapp > WhatsApp kurulumu: Bağlantıyı test et → Webhook'u 360dialog'a kaydet → Şablonları gönder (docs/15 §6.2)."
            elif [ "$WA_MODE" = "twilio" ]; then
              echo "- WhatsApp: gerçek numara (Twilio). Kurulum: $SITE_URL/admin/whatsapp > WhatsApp kurulumu: Bağlantıyı test et → Webhook'u Twilio'ya kaydet → Şablonları gönder (docs/15 §6.2d, docs/16)."
            elif [ "$WA_MODE" = "cloud" ]; then
              echo "- WhatsApp: gerçek numara (Meta Cloud API doğrudan). Kurulum: $SITE_URL/admin/whatsapp > WhatsApp kurulumu (docs/15 §6.2b)."
            else
              echo "- WhatsApp: çalışan WhatsApp yok (D360_API_KEY + WA_PHONE, TWILIO_ACCOUNT_SID + TWILIO_AUTH_TOKEN + WA_PHONE ya da META_* secret'ları eksik; mock). Vitrinde ve QR'da WhatsApp bağlantısı gösterilmez. Bağlamak: docs/15 §6.2."
            fi
            echo "- SMS: mock (SMS gönderilmez; SMS yedeği kapalı). Geliştirici araçları ve simülatör kapalı (/dev/* 404)."
            echo "- Yedek: R2'ye 2 dakikada bir (değişiklik varsa) ve her kapanışta/dağıtımda; beklenmedik çökmede en çok ~2 dakika kaybolabilir (docs/15 §13)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Duman testi (ya da deploy'un kendisi) kırmızıysa Worker'ı bir önceki sürüme döndürür. Yalnız dağıtım
      # DENENDİYSE çalışır: token/izin/yapılandırma hatasında canlıda hiçbir şey değişmemiştir.
      # `wrangler rollback` (developers.cloudflare.com/workers/wrangler/commands/workers/#rollback): sürüm kimliği
      # verilmezse en son sürümden ÖNCE yüklenene döner; `--message` etkileşimli soruyu atlar (CI'da şart); en son 100
      # sürüme dönülebilir. GERİ ALINAN: Worker kodu/yapılandırması (rotalar, özel alan adı, başlıklar, vars).
      # GERİ ALINMAYAN: (1) CONTAINER İMAJI — rollout yalnız `wrangler deploy` ile başlar
      # (/containers/configuration/rollouts: "--containers-rollout applies to wrangler deploy only"), yani postgres +
      # api + worker + web hâlâ yeni imajdadır; (2) VERİTABANI — aşağı migration yok (denetim H24).
      # Container'lar Durable Object üzerine kurulu olduğu için Cloudflare, aradaki sürümlerde DO sınıf yaşam döngüsü
      # değiştiyse geri almayı REDDEDEBİLİR: o durumda bu adım açık bir Türkçe talimat bırakır, işi kötüleştirmez.
      - name: Duman testi kırmızı → Worker'ı geri al (wrangler rollback)
        # `failure() || cancelled()`: iş 60 dk zaman aşımına düşerse ya da elle kesilirse de koşar; yoksa
        # yarım kalmış bir sürüm canlıda geri alınmadan kalırdı (fail-open). `steps.duman.outcome != 'success'`:
        # duman testi YEŞİL geçtikten sonra eklenen bir adım kırmızı yanarsa SAĞLAM dağıtım geri alınmasın.
        if: ${{ (failure() || cancelled()) && steps.dagit.outputs.attempted == 'true' && steps.duman.outcome != 'success' }}
        run: |
          mesaj="Duman testi/dağıtım kırmızı: ${DEPLOY_SHA:-bilinmeyen sürüm} geri alındı (GitHub Actions run $GITHUB_RUN_ID)"
          cfg=wrangler.generated.jsonc
          [ -f "$cfg" ] || cfg=wrangler.jsonc
          set +e
          npx wrangler rollback -c "$cfg" --message "$mesaj" 2>&1 | tee "$RUNNER_TEMP/rollback.log"
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### Dağıtım başarısız → otomatik geri alma"
            echo ""
            echo "- Dağıtılmak istenen sürüm: \`${DEPLOY_SHA:0:12}\`"
            if [ "$rc" = "0" ]; then
              echo "- \`wrangler rollback\` **başarılı**: Worker bir önceki sürüme döndü (yönlendirme, özel alan adı, başlıklar, Worker yapılandırması)."
            else
              echo "- \`wrangler rollback\` **BAŞARISIZ** (çıkış kodu $rc). Canlı Worker hâlâ bu çalıştırmanın sürümünde olabilir. Günlüğe bakın; Durable Object sınıfı değiştiyse ya da bir binding silindiyse Cloudflare geri almayı reddeder."
            fi
            echo "- ⚠️ \`wrangler rollback\` sürüm kimliği VERMEZ: en son sürümden önce yüklenene döner. \`wrangler deploy\` hiç sürüm YÜKLEMEDEN hata verdiyse (yapılandırma, izin ya da imaj derleme hatası) bu geri alma zaten sağlam olan sürümü bir adım geriye almış olabilir — \`npx wrangler versions list\` ile doğrulayın. Yarım bir dağıtımın canlıda kalmasındansa bu bilerek seçilmiş sınırdır."
            echo "- ⚠️ **Container imajı geri ALINMADI.** \`wrangler rollback\` yalnız Worker sürümünü döndürür; container rollout'u yalnız \`wrangler deploy\` başlatır. PostgreSQL + API + worker + web hâlâ bu çalıştırmanın imajında çalışıyor."
            echo "- ⚠️ **Veritabanı geri alınmadı.** Aşağı migration yok; bu dağıtım migration uyguladıysa şema yeni hâlindedir."
            echo ""
            echo "**Tam geri alış (container dahil):** Actions > \"Canlı ortam (Cloudflare)\" > Run workflow > \`ref\` alanına çalışan son commit'in SHA'sını yazın. O sürümün testleri de kapıdan geçer ve imaj yeniden derlenip rollout edilir."
            echo ""
            echo "**Durumu görmek için:** \`npx wrangler deployments list\` ve \`npx wrangler versions list\` (deploy/cloudflare dizininde)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            echo "::error::Otomatik geri alma başarısız (çıkış $rc). Canlı ortam bu çalıştırmanın sürümünde kalmış olabilir: iş akışını \`ref\` girdisiyle çalışan son commit'te elle çalıştırın (docs/15 §13)."
          fi
          # Bu adım iş akışının sonucunu DEĞİŞTİRMEZ: asıl hata (duman testi) kırmızı kalır, çalıştırma başarısız görünür.
          exit 0
