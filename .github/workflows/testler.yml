# DAĞITIM KAPISI (denetim 2026-10-04, B4 + FAZ 0.5): canlıya inen her sürüm önce buradan geçer.
# Bu iş akışı tek başına bir şey dağıtmaz; iki dağıtım iş akışı da onu `uses:` ile ÇAĞIRIR ve `needs: testler` ile
# bekler. Kapı kırmızıysa dağıtım HİÇ başlamaz (GitHub, başarısız bir `needs` işinden sonraki işi çalıştırmaz).
#   - "Canlı ortam (Cloudflare)"  → .github/workflows/deploy-dev-cloudflare.yml
#   - "Canlı ortam (Türkiye VPS)" → .github/workflows/deploy-production.yml
# NEDEN: 2026-10-04 denetimine kadar dağıtım hattı monorepo'nun 85 dosyadaki ~897 Vitest vakasının ve tür denetiminin
# HİÇBİRİNİ koşmuyordu; yalnız `deploy/cloudflare` kabuğunun 31 `node:test` vakası koşuyordu. apps/api ve packages/db
# üretimde `node --import tsx` ile çalıştığı için tür hatası derlemede yakalanmıyor, ilk istekte patlıyor (docs/15 §13).
#
# Ne koşar (hepsi gerçek PostgreSQL 16 servisine karşı, sırayla):
#   1. pnpm lint                          — ESLint (eslint.config.js): beklenmeyen promise, React kanca ihlali,
#                                           resmi olmayan WhatsApp kütüphanesi yasağı, import düzeni
#                                           (ŞİMDİLİK YALNIZ UYARI: continue-on-error; adımın başındaki nota bakın)
#   2. pnpm typecheck                     — packages/core, packages/db, apps/api, apps/web + e2e ve scripts tsconfig'leri
#   3. ALLOW_DB_RESET=1 pnpm test         — core + db + api (api testleri siparis_test veritabanını sırayla sıfırlar)
#   4. pnpm --filter @siparis/web test    — web birim testleri (lib/*, components/*; tarayıcı gerekmez)
#   5. pnpm test:vps                      — dağıtım betikleri (env-merge, cloudflare-dns, deploy.sh günlük süzgeci)
#   6. node --test .github/workflows/deploy-gate.test.mjs — bu kapının kendisi sökülmemiş mi (değişmez denetimi)
#   7. pnpm check:legal                   — künye dolu mu, yasal metin sürümü yayınlanmış mı, yer tutucu kalmış mı
#                                           (ŞİMDİLİK YALNIZ UYARI: continue-on-error; adımın başındaki nota bakın)
# Ne koşmaz (bilinçli): Playwright e2e (9 senaryo) — AYRI iş akışında: .github/workflows/e2e.yml (elle ya da gecelik,
#   dağıtımı bloke etmez). Burada koşmamasının nedeni: kendi veritabanı (*_e2e_test), derlenmiş web ve tarayıcı indirmesi
# gerekir; dağıtım kapısını ~10 dk uzatır. Ayrı bir iş akışına alınması FAZ 2 işidir (docs/09).
# Ne koşmaz (bilinçli, 2): KAPSAM ÖLÇÜMÜ (`pnpm test:coverage`). Eşikler `vitest.config.ts` içinde yapılandırıldı
# ama HENÜZ ÖLÇÜLMEMİŞ hedef değerlerdir; ölçülmemiş bir sayıyı kapıya bağlamak kapıyı ilk koşuda kırmızı yakar.
# Eray ilk ölçümü yapıp eşikleri gerçek değerlere çektikten sonra buraya şu adım eklenecek (kök vitest.config.ts
# başındaki nota bakın):
#     - name: Kapsam eşiği
#       env: { KAPSAM_ESIK: '1' }
#       run: pnpm test:coverage
# NOT 1: o adım `pnpm test` ile AYNI veritabanını kullanır, yani `pnpm test` adımının YERİNE geçmelidir — iki kez
# koşarsa kapı ~2 kat uzar.
# NOT 2 (ÖNEMLİ — yoksa kapı kırmızı yanar): `deploy-gate.test.mjs` "core+db+api testleri koşuyor mu" değişmezini
# `/run:\s*pnpm test\s*$/` ile arar. `run: pnpm test` satırı `run: pnpm test:coverage` olursa o çapa EŞLEŞMEZ ve
# son adım ("Dağıtım kapısı değişmezleri") kırmızı yanar, dağıtım hiç başlamaz. Değişiklik TEK commit'te ikisini
# birlikte yapmalıdır: bu adımı değiştir + `deploy-gate.test.mjs`teki çapayı `pnpm test(:coverage)?` yap.
#
# Veritabanı: apps/api/test/helpers.ts'teki TEST_DATABASE_URL varsayılanıyla BİREBİR aynı olmalı
# (postgres://siparis:siparis@localhost:5432/siparis_test). Değişirse deploy-gate.test.mjs kırmızı yanar.
# NOT (denetim bulgu 20): üretim container'ı `initdb --locale=C.UTF-8` ile açılıyor, bu servis ise imajın varsayılan
# yerel ayarını kullanır. Yani sıralama/`ilike` davranışı CI ile üretimde aynı değildir. Üretimdeki yerel ayar kararı
# (deploy/cloudflare/entrypoint.sh) netleştikten sonra buraya POSTGRES_INITDB_ARGS ile aynısı yazılmalıdır.
#
# ───────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# KAPININ DAĞITIMA BAĞLANMA BİÇİMİ (iki dağıtım iş akışında da aynı)
# ───────────────────────────────────────────────────────────────────────────────────────────────────────────────────
#   - `jobs.testler: { needs: kontrol, uses: ./.github/workflows/testler.yml }` — `kontrol` hazır değilse (secret
#     eksik ya da o yol seçilmemiş) kapı da koşmaz, boşa CI harcanmaz.
#   - `jobs.deploy: { needs: [kontrol, testler] }` — GitHub, başarısız bir `needs` işinden sonraki işi ÇALIŞTIRMAZ:
#     kapı kırmızıysa dağıtım hiç başlamaz. `deploy`un `if:`i yalnız `kontrol`a bakar; oraya `always()` yazmak kapıyı
#     etkisiz kılar (bu yüzden deploy-gate.test.mjs onu da denetler).
#   - `with: ref:` — elle eski bir sürüme dönülürken (geri alma) kapı O sürümün testlerini koşar.
#   - `concurrency` grubu iki dağıtım iş akışında AYNIDIR (yemekgelsin-canli-dagitim): Cloudflare ve isteğe bağlı
#     Türkiye VPS yolu aynı alan adına dağıtıyor. Üst üste çalışırlarsa Twilio mesajları bir ortama, müşteri trafiği
#     diğerine gider ve İKİ ayrı veritabanında iki ayrı sipariş gerçeği oluşur (denetim bulgu 17, split-brain).
#     `cancel-in-progress: false`: yarım kalmış bir dağıtım kesilmez, yenisi kuyruğa girer.
#
# ÖNERİ — DAL POLİTİKASI (UYGULANMADI; karar Eray'ın · denetim B5 · FAZ 0.6)
#   Bugün iki dağıtım iş akışının tetikleyicisi de `branches: [main, claude/relaxed-pascal-1m775m]`. Yani bir AJAN
#   DALINA atılan her push doğrudan yemekgelsin.net'e iniyor (VPS yolunda: DNS'i taşıyabiliyor). İlk gerçek siparişten
#   sonra bu kabul edilemez bir risktir. Önerilen üç adım:
#     a) Üretim dalı YALNIZ `main` olsun: tetikleyici listesinden `claude/relaxed-pascal-1m775m` çıkarılsın. Ajan
#        dalları PR ile `main`'e girsin.
#     b) GitHub > Settings > Environments > `production` > "Required reviewers" → Eray. Her iki `deploy` işi zaten
#        `environment: production` diyor; zorunlu inceleyici açıldığı an her dağıtım onay bekler.
#        ⚠️ Bu ayar GitHub tarafında BİLEREK AÇILMADI: açıldığı anda onay verilmeden hiçbir dağıtım tamamlanamaz;
#        canlı ortam yanlış zamanda kilitlenmesin diye kararı ve zamanlamasını Eray verir.
#     c) Settings > Branches > `main` > "Require status checks to pass" → "Testler (dağıtım kapısı)" seçilsin; böylece
#        kapı PR'da da zorunlu olur (bu iş akışına `pull_request` tetikleyicisi eklemek gerekir).
#   Tetikleyiciler BİLEREK değiştirilmedi (denetim görevinin kısıtı).
# ───────────────────────────────────────────────────────────────────────────────────────────────────────────────────
name: Testler (dağıtım kapısı)

on:
  # Dağıtım iş akışları çağırır (jobs.testler.uses). `ref` verilirse testler O commit'te koşar: elle eski bir sürüme
  # dönerken (geri alma) kapı da o sürümün testlerini koşar, dalın son hâlinin testlerini değil.
  workflow_call:
    inputs:
      ref:
        description: "Testlerin koşacağı commit/etiket/dal (boş: iş akışını tetikleyen commit)"
        type: string
        required: false
        default: ''
  # Elle çalıştırma: dağıtmadan yalnız kapıyı koşmak için (Actions > Testler (dağıtım kapısı) > Run workflow).
  workflow_dispatch:
    inputs:
      ref:
        description: "Testlerin koşacağı commit/etiket/dal (boş: seçilen dalın son hâli)"
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  testler:
    name: Tür denetimi ve testler (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      # GitHub, servis "healthy" olana kadar adımları başlatmaz; sağlık komutu servis container'ının içinde koşar.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siparis
          POSTGRES_PASSWORD: siparis
          POSTGRES_DB: siparis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siparis -d siparis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # apps/api/test/helpers.ts bu değişkeni okur; varsayılanı da aynıdır (açıkça yazmak kapının niyetini belgeler).
      TEST_DATABASE_URL: postgres://siparis:siparis@localhost:5432/siparis_test
      # Testler yalnız siparis_test'e dokunur; adı *_test kalıbına uyduğu için zaten sıfırlanabilir. Bayrağı CLAUDE.md'deki
      # komutla aynı olsun diye açıkça veriyoruz (packages/db/src/reset.ts assertResettable).
      ALLOW_DB_RESET: '1'
      # Üretimde asla; reset.ts NODE_ENV=production ise sıfırlamayı tümden reddeder.
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # pnpm sürümü package.json "packageManager" alanından okunur (10.33.0): sürüm tek yerde tanımlı kalır.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Kapının koştuğu sürüm (commit)
        run: |
          sha="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$sha" >> "$GITHUB_ENV"
          echo "Kapı bu sürümde koşuyor: ${sha:0:12}"

      - name: Bağımlılıklar
        run: pnpm install --frozen-lockfile

      # ───────────────────────────────────────────────────────────────────────────────────────────────────────────
      # LINT (denetim 2026-10-04 madde 4.6 · FAZ 4) — kural seti ve gerekçeleri `eslint.config.js` başındadır.
      # Veritabanı GEREKMEZ, bu yüzden testlerden önce: ~15 sn sürer ve kırmızıysa 50+ test beklenmeden görünür.
      # (NOT: `services:` sağlık kontrolü İŞİN başlamasını geciktirir, adımları değil — bu adım çalışırken
      #  PostgreSQL zaten hazırdır. "Beklemeden önce biter" diye okunmasın.)
      #
      # `error` seviyesi YALNIZ gerçek hata/güvenlik kurallarına ayrıldı (beklenmeyen promise, React kanca ihlali,
      # `target="_blank"` + `noopener` eksikliği, resmi olmayan WhatsApp kütüphanesi yasağı). Geri kalan her şey
      # `warn`. ESLint yalnız HATA varken sıfırdan farklı çıkış kodu verir — yani uyarılar bu adımı kırmaz.
      #
      # 2026-10-05 ÖLÇÜMÜ: 0 hata, 247 uyarı (101 dosya, ~13 sn). Yani adım bugün ZATEN YEŞİL.
      #
      # ⚠️ `continue-on-error: true` NEDEN VAR: kural seti bu depoda ilk kez koşuyor ve ölçüm yalnız macOS'ta,
      #    sıcak bir `node_modules` ile yapıldı. CI'daki Linux + temiz kurulumda `eslint-plugin-import-x`in doğal
      #    (native) çözümleyicisi (`unrs-resolver`) başka davranabilir; yeni kurulan bir kapının ilk turda canlı
      #    dağıtımı engellemesini istemiyoruz.
      #    BU SATIR, kapı birkaç yeşil tur attıktan sonra KALDIRILACAK. O andan sonra lint hatası dağıtımı durdurur.
      #    Uyarıları da kademe kademe çivilemek için: `run: pnpm lint --max-warnings 247` (bugünkü sayı; her
      #    temizlikte düşürün, böylece uyarı sayısı bir daha artamaz).
      # ───────────────────────────────────────────────────────────────────────────────────────────────────────────
      - name: Lint (ESLint)
        id: lint
        continue-on-error: true
        shell: bash
        run: pnpm lint 2>&1 | tee "$RUNNER_TEMP/lint.log"

      # `if` yalnız lint'in GERÇEKTEN koştuğu turları kapsar. `always()` tek başına yazılırsa, kurulum adımı
      # (checkout / setup-node / `pnpm install`) kırmızı yandığında lint `skipped` olur ve aşağıdaki `!= success`
      # dalı "ESLint HATA bildirdi" diye YALAN ALARM basar — arızayı gören satır, arızayı yanlış yere yazar.
      - name: Lint özeti (iş akışı özetine)
        if: always() && (steps.lint.outcome == 'success' || steps.lint.outcome == 'failure')
        shell: bash
        run: |
          # ESLint özet satırı: "✖ 259 problems (0 errors, 259 warnings)". Baştaki işaret çok baytlı olduğu için
          # satır başına çapa ATILMAZ (byte tabanlı grep tek bayt sayar ve eşleşme kaçar).
          son="$(grep -oE '[0-9]+ problems? \([0-9]+ errors?, [0-9]+ warnings?\)' "$RUNNER_TEMP/lint.log" | tail -1 || true)"
          {
            echo "### Lint (ESLint)"
            echo ""
            if [ "${{ steps.lint.outcome }}" = "success" ]; then
              echo "Hata yok. ${son:-(uyarı yok)}"
            else
              echo "**ESLint HATA bildirdi** — \`continue-on-error\` yüzünden dağıtım durmadı."
              echo ""
              echo "Kural seti ve her kuralın gerekçesi: \`eslint.config.js\`. Yerelde: \`pnpm lint\`,"
              echo "makineyle düzeltilebilenler için \`pnpm lint:fix\`."
              echo ""
              echo '```'
              tail -40 "$RUNNER_TEMP/lint.log" 2>/dev/null || echo "(lint günlüğü okunamadı; adım günlüğüne bakın)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "::warning title=Lint hatası::ESLint hata bildirdi; kapı şimdilik continue-on-error ile geçiyor. İş akışı özetine bakın."
          fi

      # Servis sağlık kontrolü yeterli olmalı; bu adım yine de açık bir Türkçe hata verir (sessiz 50 test hatası yerine).
      - name: PostgreSQL hazır mı
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null; then
              exec 3>&-
              echo "PostgreSQL hazır ($i. deneme)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL servisi 120 sn içinde 5432'de yanıt vermedi; testler koşmadan dağıtım yapılmaz."
          exit 1

      - name: Tür denetimi (tüm monorepo)
        run: pnpm typecheck

      - name: Birim ve tümleşme testleri (core, db, api)
        run: pnpm test

      - name: Web birim testleri
        run: pnpm --filter @siparis/web test

      - name: Dağıtım betikleri testleri
        run: pnpm test:vps

      # Elle eski bir sürüme dönerken (geri alma) çalışma ağacı kapıdan ÖNCEki bir commit olabilir ve o ağaçta bu
      # dosya yoktur. Zaten KOŞAN iş akışı YAML'ları seçilen DALdan gelir, çalışma ağacından değil: o sürümün
      # YAML'larını denetlemek anlamsızdır. Dosya varsa test ZORUNLUDUR (olağan push'ta hep vardır), yoksa uyarı.
      - name: Dağıtım kapısı değişmezleri
        run: |
          if [ -f .github/workflows/deploy-gate.test.mjs ]; then
            node --test .github/workflows/deploy-gate.test.mjs
          else
            echo "::warning::Bu sürümde .github/workflows/deploy-gate.test.mjs yok (kapıdan önceki bir commit); kapı değişmezleri denetlenmedi. Koşan iş akışı dosyaları seçilen daldan geldiği için kapı yine de yerinde."
          fi

      # ───────────────────────────────────────────────────────────────────────────────────────────────────────────
      # YASAL METİN DENETİMİ (denetim B1 / B2 / B12 · FAZ 0.3) — scripts/check-legal.ts
      #   1) Künye (6563 m.3) ortam değişkenlerinden tam dolmuş mu, 2) yasal metin sürümü taslak mı,
      #   3) metinlerde yer tutucu / "teyit edilecek" / TODO kalmış mı, yayımlanan yasal bağlantıların sayfası var mı,
      #   içerik özeti sürümle uyumlu mu. Gizli DEĞER yazmaz; yalnız eksik değişkenlerin ADLARINI yazar.
      #
      # ŞU AN 7 BULGU VERİYOR: gerçek şirket bilgisi (unvan, şirket türü, adres, telefon, vergi dairesi, VKN) henüz
      # girilmedi ve sürüm hâlâ "…-taslak". Bu yüzden adım dağıtım kapısını KIRMIZI YAPMAZ; yalnız iş akışı özetine
      # büyük bir uyarı bloğu yazar.
      #
      # ⚠️ BİLGİLER GİRİLDİKTEN SONRA (LEGAL_ENTITY_* değerleri + avukat onaylı tarihli sürüm) aşağıdaki
      #    `continue-on-error: true` SATIRI KALDIRILACAK. O andan sonra yasal metin bulgusu dağıtımı durdurur.
      #
      # NOT: çalışma zamanı kapısı ayrıca vardır (apps/api/src/services/orders/legal-gate.ts): canlı dağıtımda
      # (NODE_ENV=production + DEPLOY_ENV=production) metin taslaksa ya da künye eksikse POST /store/:slug/orders
      # sipariş ALMAZ. Yani bu adımın sarı kalması "taslak metinle sözleşme kurulabiliyor" demek DEĞİLDİR.
      # `shell: bash` bilerek yazıldı: GitHub yalnız açıkça seçilen bash'te `pipefail` uygular, yoksa `| tee`
      # yüzünden betiğin çıkış kodu yutulur ve adım bulgu varken de yeşil yanar.
      # ───────────────────────────────────────────────────────────────────────────────────────────────────────────
      - name: Yasal metin denetimi (künye, sürüm, yer tutucu)
        id: yasal
        continue-on-error: true
        shell: bash
        run: pnpm check:legal 2>&1 | tee "$RUNNER_TEMP/yasal-denetim.log"

      - name: Yasal metin uyarısı (iş akışı özetine)
        if: always() && steps.yasal.outcome != 'success'
        shell: bash
        run: |
          {
            echo "## YASAL METİNLER TASLAK — ÜRETİME ÇIKMADAN ÖNCE TAMAMLANMALI"
            echo ""
            echo "\`pnpm check:legal\` bulgu verdi. Bu sürüm gerçek müşteriye **sipariş veremez**: canlı dağıtımda"
            echo "sipariş ucu (\`POST /store/:slug/orders\`) fail-closed olarak 503 döner"
            echo "(\`apps/api/src/services/orders/legal-gate.ts\`), yani taslak metinle sözleşme kurulmaz."
            echo ""
            echo "**Üretime çıkmadan önce yapılacaklar**"
            echo ""
            echo "1. Gerçek künye bilgilerini \`LEGAL_ENTITY_*\` ortam değişkenlerine girin (6563 m.3)."
            echo "2. Yasal metinleri avukata onaylatın ve \`packages/core/src/enums.ts\` içindeki"
            echo "   \`LEGAL_DOCUMENT_VERSION\`'ı tarihli yayın sürümüne çevirin (ör. \`2026-10-15\`)."
            echo "3. Yeni sürümün içerik özetini \`node --import tsx scripts/check-legal.ts --ozet\` ile alıp İKİ yere"
            echo "   yazın: \`scripts/check-legal.ts\` (PINNED_TEXT_DIGEST) ve"
            echo "   \`apps/api/src/services/orders/legal-gate.ts\` (LEGAL_TEXT_DIGESTS)."
            echo "4. Bu iş akışındaki \`continue-on-error: true\` satırını **KALDIRIN** — yasal bulgu artık dağıtımı"
            echo "   durdursun."
            echo ""
            echo "### Bulgular"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/yasal-denetim.log" 2>/dev/null || echo "(denetim günlüğü okunamadı; adım günlüğüne bakın)"
            echo '```'
            echo ""
            echo "Ayrıntı: \`docs/08-mevzuat-kvkk-odeme-fatura.md\` §4.7 ve §7.5, \`docs/15-kurulum-ve-isletim.md\` §4, §12."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Yasal metinler taslak::Künye ve/veya yasal metin sürümü yayına hazır değil; canlı dağıtımda sipariş ucu kapalı kalır. İş akışı özetindeki uyarı bloğuna bakın."

      - name: Özet
        if: always()
        run: |
          {
            echo "### Dağıtım kapısı: ${{ job.status == 'success' && 'YEŞİL' || 'KIRMIZI' }}"
            echo ""
            echo "- Sürüm: \`${DEPLOY_SHA:0:12}\`"
            echo "- Koşanlar: lint, tür denetimi, core+db+api testleri, web birim testleri, dağıtım betikleri, kapı değişmezleri."
            echo "- Lint: ${{ steps.lint.outcome == 'success' && 'hata yok' || (steps.lint.outcome == 'failure' && 'HATA VAR (uyarı; dağıtımı durdurmuyor)' || 'koşmadı (önceki adım kırmızı)') }}"
            echo "- Yasal metin denetimi: ${{ steps.yasal.outcome == 'success' && 'temiz' || 'BULGU VAR (uyarı; dağıtımı durdurmuyor)' }}"
            echo "- Koşmayanlar (bilinçli): Playwright e2e → ayrı iş akışı \`Uçtan uca testler (e2e)\` (elle/gecelik); kapsam ölçümü (eşikler henüz ölçülmedi)."
            if [ "${{ job.status }}" != "success" ]; then
              echo "- **Dağıtım başlatılmadı.** Yukarıdaki kırmızı adımı düzeltip yeniden çalıştırın."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
